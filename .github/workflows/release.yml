name: Release

# Builds and uploads a Windows exe whenever a tag matching v* is pushed.
# Trigger manually from the Actions tab via workflow_dispatch for ad-hoc builds.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # upload assets + create release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Build Petris.exe
        run: python -m PyInstaller --clean --noconfirm Petris.spec

      - name: Smoke test
        run: |
          if (-not (Test-Path 'dist\Petris.exe')) { throw 'build missing' }
          $info = Get-Item 'dist\Petris.exe'
          Write-Host ('exe size: {0:N1} MB' -f ($info.Length / 1MB))

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Petris.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload as workflow artifact (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Petris-exe
          path: dist/Petris.exe
          retention-days: 14
